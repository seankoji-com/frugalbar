# CodeQL scans this repository's GitHub Actions workflows. Swift analysis was removed on
# 27 October 2026 with the owner's approval: its traced build took 16 minutes on main,
# beyond the 10-minute job budget. The Swift build, test and lint gates in
# quotabar-ci.yml are unchanged. Decision record: docs/swift-codeql-removal.md.
#
# The push.paths filter below is deliberately narrow (workflow files only). Widen it to
# Sources/** and Package*.swift at the same time as any re-added Swift job, or Swift
# pushes to main will never be analysed and nothing will report the gap.
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:actions"
