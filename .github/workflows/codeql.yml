# Required Swift checks always run real analysis, including dependency and workflow changes.
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: actions

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:actions"

  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-15
    # A traced `swift build -c debug` costs ~16-19 min here even on a cache
    # hit with no source changes. 20 minutes left no room for init + analyze +
    # runner noise: run 34107996448 was killed at the 20m0s limit with the
    # analysis step never allowed to run. 30 keeps the worst observed case in.
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build
          key: spm-codeql-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift') }}
          restore-keys: |
            spm-codeql-${{ runner.os }}-

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: swift
          build-mode: manual

      - name: Build (traced)
        run: swift build -c debug

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:swift"
