# CodeQL analysis, replacing GitHub's Default Setup.
#
# Default Setup ran Swift analysis via `autobuild` on a fresh macos-latest VM
# every time, with no cache — a full `swift build` under CodeQL's trace was
# taking ~18 of the job's ~19 minutes on every single run. This workflow
# builds manually and caches `.build` across runs so incremental builds stay
# fast; only actually-changed compile units get re-traced.

name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # weekly, matching the prior Default Setup cadence
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: actions

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:actions"

  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-codeql-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift') }}
          restore-keys: |
            spm-codeql-${{ runner.os }}-

      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      - name: Build (traced)
        run: swift build -c debug

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
