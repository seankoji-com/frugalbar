# Required checks and scanning rules need real Swift analysis for each PR head.
# Missing SARIF can block the scanning rule; a fabricated empty result would
# hide findings. Documentation-only PRs therefore pay the traced-build cost too.
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: actions

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:actions"

  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-15
    # Keep the failure deadline while measuring the complete job against 600s.
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode 16
        run: scripts/select-xcode.sh 16

      - name: Prepare SDK modules and compiler commands outside tracing
        run: |
          python3 -m unittest discover -s scripts -p test_codeql_build.py
          python3 scripts/codeql-build.py prepare "$RUNNER_TEMP/swift-compiler-plan.json"

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        id: codeql
        with:
          languages: swift
          build-mode: manual
          db-location: ${{ runner.temp }}/codeql-databases
          debug: true

      - name: Build (traced)
        run: python3 scripts/codeql-build.py compile "$RUNNER_TEMP/swift-compiler-plan.json"

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:swift"

      - name: Require extraction of every application source
        env:
          CODEQL: ${{ steps.codeql.outputs.codeql-path }}
        run: |
          "$CODEQL" bqrs decode --format=json \
            "$RUNNER_TEMP/codeql-databases/swift/results/codeql/swift-queries/diagnostics/ExtractedFiles.bqrs" \
            > "$RUNNER_TEMP/swift-extracted-files.json"
          python3 scripts/codeql-build.py coverage "$RUNNER_TEMP/swift-extracted-files.json"
