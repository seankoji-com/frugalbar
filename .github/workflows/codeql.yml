# Required checks and scanning rules need real Swift analysis for each PR head.
# Missing SARIF can block the scanning rule; a fabricated empty result would
# hide findings. Documentation-only PRs therefore pay the traced-build cost too.
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: actions

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:actions"

  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-15
    # A traced `swift build -c debug` costs ~16-19 min here even on a cache
    # hit with no source changes. 20 minutes left no room for init + analyze +
    # runner noise: run 34107996448 was killed at the 20m0s limit with the
    # analysis step never allowed to run. 30 keeps the worst observed case in.
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode 16
        run: scripts/select-xcode.sh 16

      # In job 121185714143, manifest preparation took 7s but traced build
      # planning still took 438s before compilation began. Cache the complete
      # plan, not compiled objects: every application source is built below.
      - name: Prepare SwiftPM build plan
        run: swift build -c debug --print-manifest-job-graph > "$RUNNER_TEMP/swift-build-plan.dot"

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual

      - name: Build (traced)
        run: swift build -c debug

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:swift"
