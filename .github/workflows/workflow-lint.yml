# Workflow linting.
#
# The Swift CI workflow used to filter on Sources/Tests/Package.swift, so edits
# to .github/ never triggered anything. release.yml sat unparseable for three
# days and three merged PRs because of it. This job watches .github/** and runs
# actionlint, which catches YAML syntax errors, bad expressions, unknown action
# inputs, and shellcheck findings inside run: blocks.
#
# Kept separate from quotabar-ci.yml because it wants a Linux runner and a
# docker:// step, not macOS.

name: Workflow Lint

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Maintained fork, not rhysd/actionlint: upstream is inactive and its
      # latest release rejects `concurrency.queue`, which the synced gatekeeper
      # caller uses (rhysd/actionlint#661 was closed unmerged). The fork
      # implements it and keeps the same CLI. The image bundles shellcheck and
      # pyflakes, so run:/python blocks get linted too.
      # See seankoji-com/.github#200.
      - name: Run actionlint
        uses: docker://kjanat/actionlint@sha256:6808f2904057790c7c60715005dc014e447fe206e348803fb14e82c9b0816b06 # 1.16.1
        with:
          args: -color
