# Workflow linting.
#
# The Swift CI workflow used to filter on Sources/Tests/Package.swift, so edits
# to .github/ never triggered anything. release.yml sat unparseable for three
# days and three merged PRs because of it. This job watches .github/** and runs
# actionlint, which catches YAML syntax errors, bad expressions, unknown action
# inputs, and shellcheck findings inside run: blocks.
#
# Kept separate from quotabar-ci.yml because it wants a Linux runner and a
# Docker-based step, not macOS.

name: Workflow Lint

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # Pinned to the same version used locally. The image bundles shellcheck
      # and pyflakes, so run:/python blocks get linted too.
      #
      # Invoked with `docker run` rather than `uses: docker://...`: the runner
      # splits a `uses` step's `args` input on whitespace, so a `-ignore`
      # pattern containing a space gets torn apart. actionlint 1.7.12 does not
      # recognise the valid `concurrency.queue` key, so that pattern is needed
      # to silence the false positive (rhysd/actionlint#657).
      - name: Run actionlint
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12 \
            -color -ignore 'unexpected key "queue"'
