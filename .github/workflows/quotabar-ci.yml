# QuotaBar — Swift build & test workflow
#
# Builds the QuotaBar Swift package and runs all tests.
# Uses the on-demand macOS native runner pool on carey-mac
# (see wiki: services/github-runners.md § macOS pool).
# If the mac pool is unavailable, switch to macos-latest.
#
# To provision: ssh carey-mac '~/repos/mac-runners-provision.sh 2 --macos'

name: QuotaBar CI

on:
  push:
    branches: [main, quotabar-swift-prototype]
    paths:
      - "QuotaBar/**"
  pull_request:
    branches: [main]
    paths:
      - "QuotaBar/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: [self-hosted, macOS, ARM64, mac]
    defaults:
      run:
        working-directory: QuotaBar

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build -c debug

      - name: Run tests
        run: swift test -c debug --parallel
