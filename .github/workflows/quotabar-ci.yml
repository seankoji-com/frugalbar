# FrugalBar — Swift build & test workflow
#
# Runs on GitHub-hosted macOS (macos-15 / Sequoia / Apple Silicon).
#
# No `paths:` filter on purpose. "Build & Test (macOS)" is a required status
# check on main, and a filtered workflow simply never reports on PRs it skips,
# leaving them permanently unmergeable rather than green. Required checks and
# path filters do not mix.

name: FrugalBar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      verify_gemini_mutations:
        description: Prove Gemini quota regressions
        type: boolean
        default: false
      verify_mutations:
        description: Prove scheduler and OAuth regressions reject independent mutations
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 16
        run: scripts/select-xcode.sh 16

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Verify monthly credit WebKit scripts offline
        run: node scripts/test-claude-monthly-credit-scripts.mjs

      - name: Verify Gemini proof failure bookkeeping offline
        run: python3 scripts/test_verify_gemini_regression.py

      # Warnings are how this project's defects announced themselves; treat
      # them as failures so the zero-warning state cannot silently rot.
      - name: Build (warnings are errors)
        run: swift build -c debug -Xswiftc -warnings-as-errors

      - name: Verify frugalbar binary runs
        run: |
          # Shared CLI smoke check (scripts/verify-cli.sh), which release.yml
          # also calls, so the two never drift. No release copy step here
          # (that's release.yml's job) — exercise the debug binary SwiftPM
          # just built directly, under a 10s perl watchdog.
          #
          # A plain exit-0 check can't tell "printed the right thing" from
          # "printed nothing and exited clean" — assert the actual output. An
          # unstamped debug build always resolves to AppInfo.developmentLabel;
          # anything else here means the version-resolution fallback broke.
          #
          # The script checks BOTH --version (exact text) and --help
          # (containing "Usage: <usage-name>") — so this single invocation
          # also covers the --help path the Homebrew formula's `test do` runs,
          # which would otherwise only fail downstream on `brew test`.
          scripts/verify-cli.sh \
            --binary .build/debug/QuotaBar \
            --version-text "FrugalBar development build" \
            --usage QuotaBar

      # The real-clock deadline suite runs in its own invocation, the rest in
      # parallel; the script checks the two selections cover the whole suite.
      - name: Run tests
        run: scripts/run-swift-tests.sh --enable-code-coverage

      # Keep the first run's report before the separate flake check rebuilds
      # without instrumentation. Report publication starts advisory.
      - name: Locate Swift coverage report
        id: coverage
        continue-on-error: true
        run: echo "path=$(swift test -c debug --show-codecov-path)" >> "$GITHUB_OUTPUT"

      - name: Preserve Swift coverage report
        if: steps.coverage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-coverage
          path: ${{ steps.coverage.outputs.path }}
          if-no-files-found: error

      # LLVM owns line accounting; the converter must preserve every line/hit
      # pair. Keep reporting advisory until native coverage is configured.
      - name: Convert and verify Swift Cobertura
        id: cobertura
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/swift-coverage-tools"
          "$RUNNER_TEMP/swift-coverage-tools/bin/pip" install lcov-cobertura==2.1.1
          "$RUNNER_TEMP/swift-coverage-tools/bin/python" scripts/test_export_swift_coverage.py
          "$RUNNER_TEMP/swift-coverage-tools/bin/python" scripts/export-swift-coverage.py

      - name: Preserve verified Cobertura
        if: steps.cobertura.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-cobertura
          path: |
            coverage/coverage.xml
            coverage/swift.lcov
          if-no-files-found: error

      # This task's same-repository PR must produce proof artifacts without
      # workflow_dispatch permission. Other PRs retain the ordinary test path.
      - name: Render production SwiftUI credit rows
        id: credit-renders
        if: (github.event_name == 'workflow_dispatch' && inputs.verify_mutations) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 't3/monthly-credits-openai-balance-poll-backoff')
        run: FRUGALBAR_RENDER_DIR="$RUNNER_TEMP/frugalbar-renders" swift test -c debug --filter UXRenderTests

      - name: Preserve SwiftUI renders
        if: always() && steps.credit-renders.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.verify_mutations) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 't3/monthly-credits-openai-balance-poll-backoff'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swiftui-credit-renders
          path: ${{ runner.temp }}/frugalbar-renders/
          if-no-files-found: error

      # Tests must be hermetic. Re-running proves there is no ordering or clock
      # dependence — a formatter that truncated instead of rounding used to
      # fail roughly one run in four.
      - name: Re-run tests (flake check)
        run: scripts/run-swift-tests.sh

  # Each independent shard retains baseline/assertion-red/restored proof.
  # Keep failures blocking, and finish both inventories even if one fails.
  regression-mutations:
    name: Regression mutations (macOS, shard ${{ matrix.shard-index }})
    if: (github.event_name == 'workflow_dispatch' && inputs.verify_mutations) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 't3/monthly-credits-openai-balance-poll-backoff')
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Match the build job's event revision, including the PR merge ref.
          ref: ${{ github.sha }}

      - name: Select Xcode 16
        run: scripts/select-xcode.sh 16

      - name: Verify mutation partition
        run: python3 scripts/test_verify_regression_mutations.py

      # Match run_test's debug configuration so cold compilation stays outside
      # its 180-second per-case budget. The required job checks warnings.
      - name: Build mutation test baseline
        run: swift build -c debug --build-tests

      - name: Prove regression mutations
        run: python3 scripts/verify-regression-mutations.py --shard-index ${{ matrix.shard-index }} --shard-count 2

      - name: Preserve mutation proof logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-mutation-proof-shard-${{ matrix.shard-index }}
          path: coverage/mutations/
          if-no-files-found: warn

  gemini-regression:
    name: Gemini regression proof (macOS)
    if: (github.event_name == 'workflow_dispatch' && inputs.verify_gemini_mutations) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'verify-gemini-mutations'))
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The proof restores the exact original provider from its pinned revision.
          fetch-depth: 0
      - name: Select Xcode 16
        run: scripts/select-xcode.sh 16
      - name: Verify Gemini proof failure bookkeeping offline
        run: python3 scripts/test_verify_gemini_regression.py
      - name: Build mutation test baseline
        run: swift build -c debug --build-tests
      - name: Prove Gemini regression
        run: python3 scripts/verify-gemini-regression.py
      - name: Render representative exhausted Gemini row
        run: FRUGALBAR_RENDER_DIR="$RUNNER_TEMP/gemini-renders" swift test -c debug --filter UXRenderTests/renderGemini
      - name: Preserve Gemini proof and render
        # Proof is written before rendering; a failed render stays blocking and
        # cannot erase the proof directory. Early proof failures write a failed
        # manifest too, including setup failures before the first mutation.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gemini-regression-proof
          path: |
            coverage/gemini-mutations/
            ${{ runner.temp }}/gemini-renders/
          if-no-files-found: error

  # Early warning for the next toolchain. Swift 6.4 turned an implicit strong
  # capture and a redundant Sendable conformance into errors under
  # -warnings-as-errors while the pinned Xcode 16 job stayed green. This job
  # uses the newest Xcode on the newest hosted image and is allowed to fail,
  # so it reports breakage without blocking merges.
  build-and-test-latest-xcode:
    name: Build & Test (latest Xcode, allowed to fail)
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select newest installed Xcode
        run: scripts/select-xcode.sh

      - name: Build (warnings are errors)
        run: swift build -c debug --build-tests -Xswiftc -warnings-as-errors

      - name: Run tests
        run: scripts/run-swift-tests.sh
