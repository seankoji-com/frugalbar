# QuotaBar — Swift build & test workflow
#
# Runs on GitHub-hosted macOS runners. A previous revision pointed this at a
# self-hosted pool labelled [self-hosted, macOS, ARM64, mac]; no runner in the
# org carries the `macOS` or `mac` labels, so every job queued indefinitely and
# CI never executed once. If a self-hosted macOS pool is provisioned later,
# switch `runs-on` back — but only after confirming the labels exist.

name: QuotaBar CI

on:
  push:
    branches: [main, quotabar-swift-prototype]
    paths:
      - "QuotaBar/**"
      - ".github/workflows/quotabar-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "QuotaBar/**"
      - ".github/workflows/quotabar-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-latest
    # A hung job must fail, not queue forever.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: QuotaBar

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      # Warnings are how this project's defects announced themselves last time;
      # treat them as failures so the zero-warning state cannot silently rot.
      - name: Build (warnings are errors)
        run: swift build -c debug -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test -c debug --parallel

      # Tests must be hermetic. Re-running them proves there is no ordering or
      # clock dependence — a formatter that truncated instead of rounding used
      # to fail roughly one run in four.
      - name: Re-run tests (flake check)
        run: swift test -c debug --parallel
