# QuotaBar — Swift build & test workflow
#
# Runs on the org's self-hosted macOS pool.
#
# Why not `macos-latest`: this repo is private, so GitHub-hosted macOS minutes
# are billed at a 10x multiplier, and the account currently rejects those jobs
# ("recent account payments have failed or your spending limit needs to be
# increased"). The self-hosted pool is the working path.
#
# Why the labels matter: an earlier revision targeted this same label set while
# **no runner carried `macOS` or `mac`**, so every job queued until it expired
# and CI never executed once. Before changing `runs-on`, confirm the labels
# exist:
#
#   gh api -X GET orgs/seankoji-com/actions/runners \
#     --jq '.runners[] | "\(.name) \(.status) \([.labels[].name]|join(","))"'
#
# To provision more: see the `mac-runners` skill (`--macos` for native runners).

name: QuotaBar CI

on:
  push:
    branches: [main, quotabar-swift-prototype]
    paths:
      - "QuotaBar/**"
      - ".github/workflows/quotabar-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "QuotaBar/**"
      - ".github/workflows/quotabar-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: [self-hosted, macOS, ARM64, mac]
    # A hung job must fail, not queue forever.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: QuotaBar

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      # Warnings are how this project's defects announced themselves; treat
      # them as failures so the zero-warning state cannot silently rot.
      - name: Build (warnings are errors)
        run: swift build -c debug -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test -c debug --parallel

      # Tests must be hermetic. Re-running proves there is no ordering or clock
      # dependence — a formatter that truncated instead of rounding used to
      # fail roughly one run in four.
      - name: Re-run tests (flake check)
        run: swift test -c debug --parallel

      # Self-hosted runners persist state between jobs; don't leak build output.
      - name: Clean workspace
        if: always()
        run: rm -rf .build
