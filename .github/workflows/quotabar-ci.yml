# FrugalBar — Swift build & test workflow
#
# Runs on GitHub-hosted macOS (macos-15 / Sequoia / Apple Silicon).
#
# No `paths:` filter on purpose. "Build & Test (macOS)" is a required status
# check on main, and a filtered workflow simply never reports on PRs it skips,
# leaving them permanently unmergeable rather than green. Required checks and
# path filters do not mix.

name: FrugalBar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      # Warnings are how this project's defects announced themselves; treat
      # them as failures so the zero-warning state cannot silently rot.
      - name: Build (warnings are errors)
        run: swift build -c debug -Xswiftc -warnings-as-errors

      - name: Verify frugalbar binary runs
        run: |
          # No release copy step here (that's release.yml's job) — exercise
          # the debug binary SwiftPM just built directly. macOS runners ship
          # no GNU `timeout`; perl's alarm() is the portable substitute, and
          # its itimer survives exec() so a hang still gets killed.
          #
          # A plain exit-0 check can't tell "printed the right thing" from
          # "printed nothing and exited clean" — assert the actual output. An
          # unstamped debug build always resolves to AppInfo.developmentLabel;
          # anything else here means the version-resolution fallback broke.
          OUTPUT=$(perl -e 'alarm 10; exec @ARGV or die "exec failed: $!"' .build/debug/QuotaBar --version)
          echo "$OUTPUT"
          [ "$OUTPUT" = "development build" ] || {
            echo "::error::expected --version to print 'development build' on an unstamped CI build, got: $OUTPUT"
            exit 1
          }

      - name: Verify frugalbar --help
        run: |
          # The Homebrew formula's own `test do` block runs `frugalbar --help`,
          # not `--version` — this CI job otherwise never exercises that path,
          # so a broken --help could ship and only fail `brew test` downstream.
          HELP=$(perl -e 'alarm 10; exec @ARGV or die "exec failed: $!"' .build/debug/QuotaBar --help)
          echo "$HELP"
          echo "$HELP" | grep -q "Usage: frugalbar" || {
            echo "::error::--help output did not contain the expected 'Usage: frugalbar' line"
            exit 1
          }

      - name: Run tests
        run: swift test -c debug --parallel

      # Tests must be hermetic. Re-running proves there is no ordering or clock
      # dependence — a formatter that truncated instead of rounding used to
      # fail roughly one run in four.
      - name: Re-run tests (flake check)
        run: swift test -c debug --parallel
