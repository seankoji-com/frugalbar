name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Release Version Bump"
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  tag-and-release:
    name: Tag & Build Release
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version
        id: semver
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          BUMP="${{ github.event.inputs.bump_type }}"
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi
          
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "Calculated new version: ${NEW_TAG}"

      - name: Tag commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.semver.outputs.tag }}" -m "Release ${{ steps.semver.outputs.tag }}"
          git push origin "${{ steps.semver.outputs.tag }}"

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build Release (ARM64)
        run: |
          swift build -c release --arch arm64 -Xswiftc -warnings-as-errors
          mkdir -p bin
          cp .build/arm64-apple-macosx/release/QuotaBar bin/frugalbar
          tar -czvf frugalbar-${{ steps.semver.outputs.tag }}-arm64.tar.gz -C bin frugalbar
          shasum -a 256 frugalbar-${{ steps.semver.outputs.tag }}-arm64.tar.gz > frugalbar-${{ steps.semver.outputs.tag }}-arm64.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: ${{ steps.semver.outputs.tag }}
          files: |
            frugalbar-${{ steps.semver.outputs.tag }}-arm64.tar.gz
            frugalbar-${{ steps.semver.outputs.tag }}-arm64.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Update Homebrew Tap Formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          VER="${TAG#v}"
          SHA=$(cat frugalbar-${TAG}-arm64.tar.gz.sha256 | awk '{print $1}')
          URL="https://github.com/seankoji-com/frugalbar/releases/download/${TAG}/frugalbar-${TAG}-arm64.tar.gz"
          BRANCH="release-${TAG}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/seankoji-com/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula

          sed -e "s|__VERSION__|${VER}|" \
              -e "s|__URL__|${URL}|" \
              -e "s|__SHA256__|${SHA}|" \
              "${GITHUB_WORKSPACE}/packaging/frugalbar.rb.tmpl" \
              > /tmp/homebrew-tap/Formula/frugalbar.rb

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add Formula/frugalbar.rb

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "feat(formula): update frugalbar to ${TAG}"
          git push origin "${BRANCH}"

          # main is protected by an org-wide ruleset requiring PRs, so push to a
          # branch and merge a PR instead of pushing directly (0 reviews required).
          PR_URL=$(gh pr create --repo seankoji-com/homebrew-tap \
            --base main --head "${BRANCH}" \
            --title "feat(formula): update frugalbar to ${TAG}" \
            --body "Automated formula update for ${TAG}.")
          gh pr merge --repo seankoji-com/homebrew-tap "${PR_URL}" --squash --delete-branch


