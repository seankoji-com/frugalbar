name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Release Version Bump"
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  tag-and-release:
    name: Tag & Build Release
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine Next Version
        id: semver
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          BUMP="${{ github.event.inputs.bump_type }}"
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi
          
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "Calculated new version: ${NEW_TAG}"

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build Release (ARM64)
        run: |
          # The release ships a bare executable, so Bundle.main carries no
          # version for the About window to read. Stamp the tag into the source
          # before building — same __VERSION__ templating the formula uses.
          VER="${{ steps.semver.outputs.tag }}"
          VER="${VER#v}"
          sed -i '' "s|\"__VERSION__\"|\"${VER}\"|" Sources/QuotaBarCore/Models/AppInfo.swift
          grep -q "\"${VER}\"" Sources/QuotaBarCore/Models/AppInfo.swift \
            || { echo "::error::version stamp did not apply"; exit 1; }
          swift build -c release --arch arm64 -Xswiftc -warnings-as-errors
          mkdir -p bin
          cp .build/arm64-apple-macosx/release/QuotaBar bin/frugalbar
          tar -czvf frugalbar-${{ steps.semver.outputs.tag }}-arm64.tar.gz -C bin frugalbar
          shasum -a 256 frugalbar-${{ steps.semver.outputs.tag }}-arm64.tar.gz > frugalbar-${{ steps.semver.outputs.tag }}-arm64.tar.gz.sha256

      - name: Verify frugalbar binary runs
        run: |
          # Shared CLI smoke check (scripts/verify-cli.sh) — the same script
          # quotabar-ci.yml runs against the debug binary, so the two verify
          # paths stay in sync. It exercises the built release artifact under
          # a 10s perl watchdog (macOS ships no GNU `timeout`; perl's alarm()
          # itimer survives exec(), so a hang still gets killed), and tells a
          # watchdog kill (142) apart from a normal crash with a ::error:: line.
          #
          # The sed check in the previous step only confirms the *source*
          # got stamped — it says nothing about the binary SwiftPM actually
          # produced. A stale .build object or a bad `cp` could still ship a
          # release whose --version prints the development label; assert the
          # built artifact's own output instead of just its exit code.
          VER="${{ steps.semver.outputs.tag }}"
          VER="${VER#v}"
          scripts/verify-cli.sh \
            --binary bin/frugalbar \
            --version-text "FrugalBar ${VER}" \
            --usage frugalbar

      # After the build and the binary smoke check, but *before* the release:
      # action-gh-release creates the tag itself when `tag_name` does not yet
      # exist, and it creates a lightweight one. Tagging afterwards then tries
      # to push an annotated tag object onto a ref that already exists, which
      # git rejects ("already exists") and fails the job with the release
      # already published. Tag first; the release action then just attaches to
      # the existing tag.
      - name: Tag commit
        id: tag_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.semver.outputs.tag }}" -m "Release ${{ steps.semver.outputs.tag }}"
          git push origin "${{ steps.semver.outputs.tag }}"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: ${{ steps.semver.outputs.tag }}
          files: |
            frugalbar-${{ steps.semver.outputs.tag }}-arm64.tar.gz
            frugalbar-${{ steps.semver.outputs.tag }}-arm64.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

      # If the tag was pushed but the release itself failed to publish, an
      # unreleased tag is left behind — the next run's "Determine Next
      # Version" reads it via `git describe` and silently bumps past it, so a
      # re-run ships the *next* version instead of retrying this one. Only
      # cleans up when the tag push succeeded and the release publish did
      # not: a failure in a later step (e.g. the Homebrew tap update) means
      # the release already shipped, and the tag must stay.
      #
      # `always()` rather than `failure()`: a cancelled job reports neither
      # success nor failure, so `failure()` would skip cleanup and leave the
      # orphaned tag behind on a cancel between tag-push and release.
      - name: Delete orphaned tag if the release failed to publish
        if: always() && steps.tag_commit.outcome == 'success' && steps.create_release.outcome != 'success'
        run: |
          if ! git push --delete origin "${{ steps.semver.outputs.tag }}"; then
            echo "::error::delete of orphaned tag failed: ${{ steps.semver.outputs.tag }}"
            exit 1
          fi

      - name: Generate seankoji-com-ci App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SEANKOJI_CI_APP_ID }}
          private-key: ${{ secrets.SEANKOJI_CI_PRIVATE_KEY }}
          owner: seankoji-com
          repositories: homebrew-tap

      # seankoji-com-ci is an "always" bypass_actor on the CodeQL-required org
      # ruleset, but the org-wide required-PR ruleset applies to every repo
      # with no bypass actor, so a direct push to homebrew-tap's main is
      # always rejected (GH013). Push to a release branch and open a PR with
      # auto-merge instead -- the ruleset requires 0 approvals, so it merges
      # itself as soon as it's mergeable.
      - name: Update Homebrew Tap Formula
        env:
          TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          VER="${TAG#v}"
          SHA=$(cat frugalbar-${TAG}-arm64.tar.gz.sha256 | awk '{print $1}')
          URL="https://github.com/seankoji-com/frugalbar/releases/download/${TAG}/frugalbar-${TAG}-arm64.tar.gz"
          BRANCH="release-${TAG}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/seankoji-com/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula

          sed -e "s|__VERSION__|${VER}|" \
              -e "s|__URL__|${URL}|" \
              -e "s|__SHA256__|${SHA}|" \
              "${GITHUB_WORKSPACE}/packaging/frugalbar.rb.tmpl" \
              > /tmp/homebrew-tap/Formula/frugalbar.rb

          cd /tmp/homebrew-tap
          git config user.name "seankoji-com-ci[bot]"
          git config user.email "288827119+seankoji-com-ci[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add Formula/frugalbar.rb

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "feat(formula): update frugalbar to ${TAG}"
          git push origin "${BRANCH}"

          PR_URL=$(gh pr create --repo seankoji-com/homebrew-tap \
            --base main --head "${BRANCH}" \
            --title "feat(formula): update frugalbar to ${TAG}" \
            --body "Automated formula update for ${TAG}.")
          gh pr merge --repo seankoji-com/homebrew-tap "${PR_URL}" --squash --auto

